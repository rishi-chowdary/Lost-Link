<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inbox | LostLink</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LostLink real-time inbox — message people about lost and found items.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            height: 100vh; overflow: hidden; background: #0a0a14;
        }

        /* ── Layout ── */
        .messenger-wrap {
            position: fixed; top: 72px; left: 0; right: 0; bottom: 0;
            display: flex; align-items: stretch;
            padding: 16px 20px; gap: 16px;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
            background: rgba(255,255,255,0.04); backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; overflow: hidden;
        }
        .sidebar-header {
            padding: 20px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
        }
        .sidebar-title-row {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
        }
        .sidebar-title { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .compose-btn {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, #7c6ef5, #22d3ee);
            border: none; border-radius: 10px; color: white; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .compose-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(124,110,245,0.4); }

        .search-wrap { position: relative; }
        .search-wrap svg {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            opacity: 0.35; pointer-events: none;
        }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 10px 14px 10px 38px; color: white;
            font-size: 0.88rem; font-family: inherit; outline: none; transition: all 0.2s ease;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.3); }
        .search-input:focus {
            border-color: rgba(124,110,245,0.5); background: rgba(255,255,255,0.09);
            box-shadow: 0 0 0 3px rgba(124,110,245,0.12);
        }

        .chats-list { flex: 1; overflow-y: auto; padding: 6px 0; }
        .chats-list::-webkit-scrollbar { width: 4px; }
        .chats-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        /* Chat item */
        .chat-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            cursor: pointer; transition: background 0.15s ease; position: relative;
        }
        .chat-item::after {
            content: ''; position: absolute; left: 68px; right: 16px; bottom: 0;
            height: 1px; background: rgba(255,255,255,0.04);
        }
        .chat-item:last-child::after { display: none; }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: rgba(124,110,245,0.12); border-left: 3px solid #7c6ef5; }

        /* Sidebar avatar */
        .ci-avatar-wrap { position: relative; flex-shrink: 0; }
        .ci-avatar {
            width: 46px; height: 46px; border-radius: 14px;
            background: linear-gradient(135deg, #7c6ef5, #22d3ee);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem; font-weight: 700; color: white;
        }
        /* Online dot — hidden by default, shown via JS */
        .ci-online-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 10px; height: 10px; background: #22c55e;
            border: 2px solid #0a0a14; border-radius: 50%;
            display: none;
        }
        .ci-online-dot.visible { display: block; }

        .ci-body { flex: 1; min-width: 0; }
        .ci-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
        .ci-name {
            font-size: 0.92rem; font-weight: 600; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 155px;
        }
        .ci-time { font-size: 0.7rem; color: rgba(255,255,255,0.3); flex-shrink: 0; margin-left: 6px; }
        .ci-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .ci-preview {
            font-size: 0.8rem; color: rgba(255,255,255,0.4);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .ci-preview.unread { color: rgba(255,255,255,0.85); font-weight: 500; }
        .ci-badge {
            background: linear-gradient(135deg, #7c6ef5, #22d3ee);
            color: white; border-radius: 50%; min-width: 20px; height: 20px;
            font-size: 0.68rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; flex-shrink: 0;
            animation: badgePop 0.3s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes badgePop { from { transform: scale(0); } to { transform: scale(1); } }

        .empty-sidebar {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; padding: 40px 20px;
            text-align: center; opacity: 0.35; gap: 10px;
        }
        .empty-sidebar span { font-size: 3rem; }
        .empty-sidebar p { font-size: 0.85rem; color: rgba(255,255,255,0.6); }

        /* ── Chat window ── */
        .chat-window {
            flex: 1; display: flex; flex-direction: column;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; overflow: hidden; min-width: 0;
        }
        .no-chat {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            text-align: center; padding: 40px;
        }
        .no-chat-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, rgba(124,110,245,0.15), rgba(34,211,238,0.15));
            border-radius: 24px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; border: 1px solid rgba(124,110,245,0.2);
        }
        .no-chat h3 { font-size: 1.2rem; color: rgba(255,255,255,0.7); font-weight: 600; }
        .no-chat p { font-size: 0.85rem; color: rgba(255,255,255,0.35); max-width: 240px; line-height: 1.5; }

        #activeChat { display: none; flex-direction: column; height: 100%; }

        /* Chat header */
        .chat-header {
            padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); flex-shrink: 0;
        }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            display: none; background: rgba(255,255,255,0.08); border: none; border-radius: 10px;
            width: 36px; height: 36px; color: white; font-size: 1rem; cursor: pointer;
            align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }

        .header-avatar-wrap { position: relative; }
        .header-avatar {
            width: 42px; height: 42px; background: linear-gradient(135deg, #7c6ef5, #22d3ee);
            border-radius: 13px; display: flex; align-items: center; justify-content: center;
            font-size: 1.05rem; font-weight: 700; color: white;
        }
        /* Header online ring — hidden by default */
        .header-avatar-wrap.online .header-avatar {
            box-shadow: 0 0 0 2px #0a0a14, 0 0 0 4px #22c55e;
        }

        .header-info h4 { font-size: 0.93rem; font-weight: 700; color: #fff; margin-bottom: 1px; }
        .header-status { font-size: 0.73rem; font-weight: 500; transition: color 0.3s; }
        .header-status.online  { color: #22c55e; }
        .header-status.offline { color: rgba(255,255,255,0.35); }
        .header-status.typing  { color: #7c6ef5; font-style: italic; }

        /* ── Messages ── */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px 24px;
            display: flex; flex-direction: column; gap: 2px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        /* Date separator */
        .date-sep {
            display: flex; align-items: center; gap: 10px;
            margin: 14px 0 10px; opacity: 0.38;
        }
        .date-sep::before, .date-sep::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.12);
        }
        .date-sep span {
            font-size: 0.7rem; font-weight: 600; color: rgba(255,255,255,0.55);
            white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Message groups */
        .msg-group { display: flex; flex-direction: column; margin-bottom: 8px; }
        .msg-group.sent     { align-items: flex-end; }
        .msg-group.received { align-items: flex-start; }

        /* Bubbles */
        .bubble {
            max-width: 66%; padding: 10px 14px; border-radius: 18px;
            font-size: 0.9rem; line-height: 1.55; word-break: break-word;
            animation: bubbleIn 0.22s cubic-bezier(.34,1.56,.64,1);
            margin-bottom: 2px; position: relative;
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: scale(0.9) translateY(5px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .bubble.sent {
            background: linear-gradient(135deg, #7c6ef5, #5f50e0);
            color: white; border-bottom-right-radius: 5px;
        }
        .bubble.sent.failed { background: rgba(239,68,68,0.3); border: 1px solid rgba(239,68,68,0.4); }
        .bubble.received {
            background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.92); border-bottom-left-radius: 5px;
        }
        /* Tail shaping for non-last bubbles */
        .msg-group .bubble:not(:last-of-type).sent     { border-bottom-right-radius: 18px; }
        .msg-group .bubble:not(:last-of-type).received { border-bottom-left-radius: 18px; }

        /* Bubble meta (time + tick) */
        .bubble-meta {
            display: flex; align-items: center; gap: 3px;
            margin-top: 2px; margin-bottom: 4px; height: 14px;
        }
        .msg-group.sent     .bubble-meta { justify-content: flex-end; }
        .msg-group.received .bubble-meta { justify-content: flex-start; }
        .bubble-time { font-size: 0.67rem; color: rgba(255,255,255,0.28); }

        /* Delivery / read ticks */
        .msg-tick { font-size: 0.72rem; line-height: 1; transition: color 0.3s; }
        .msg-tick.pending { color: rgba(255,255,255,0.25); }   /* ○ sending */
        .msg-tick.sent    { color: rgba(255,255,255,0.45); }   /* ✓ stored in DB */
        .msg-tick.read    { color: #7c6ef5; }                  /* ✓✓ recipient read it */

        /* ── Typing indicator (lives in message flow, not outside) ── */
        .typing-row {
            display: none; align-items: flex-start; gap: 10px;
            margin-bottom: 8px; padding: 0 4px;
        }
        .typing-row.visible { display: flex; }
        .typing-bubble {
            background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px; border-bottom-left-radius: 5px;
            padding: 11px 16px; display: flex; align-items: center; gap: 4px;
        }
        .typing-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,0.45);
            animation: tdot 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.18s; }
        .typing-dot:nth-child(3) { animation-delay: 0.36s; }
        @keyframes tdot {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.38; }
            40%            { transform: translateY(-5px); opacity: 1; }
        }

        /* ── Input ── */
        .chat-input-area {
            padding: 12px 18px 14px; background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
        }
        .input-row {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 8px 8px 8px 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-row:focus-within {
            border-color: rgba(124,110,245,0.5); box-shadow: 0 0 0 3px rgba(124,110,245,0.1);
        }
        #messageInput {
            flex: 1; background: transparent; border: none; color: white;
            font-size: 0.9rem; font-family: inherit; outline: none;
        }
        #messageInput::placeholder { color: rgba(255,255,255,0.25); }
        .send-btn {
            width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
            background: linear-gradient(135deg, #7c6ef5, #22d3ee);
            border: none; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
        }
        .send-btn:hover  { transform: scale(1.08); box-shadow: 0 4px 14px rgba(124,110,245,0.5); }
        .send-btn:active { transform: scale(0.95); }

        /* ── Toasts ── */
        #inboxToastContainer {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            display: flex; flex-direction: column-reverse; gap: 10px; max-width: 310px;
        }
        .inbox-toast {
            background: rgba(12,12,24,0.97); backdrop-filter: blur(24px);
            border: 1px solid rgba(124,110,245,0.25); border-radius: 16px;
            padding: 12px 13px; display: flex; align-items: center; gap: 11px;
            cursor: pointer; box-shadow: 0 8px 28px rgba(0,0,0,0.55);
            animation: toastIn .3s cubic-bezier(.34,1.56,.64,1) forwards;
        }
        .toast-av {
            width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
            background: linear-gradient(135deg, #7c6ef5, #22d3ee);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem; font-weight: 700; color: white;
        }
        .toast-body { flex: 1; min-width: 0; }
        .toast-name { font-weight: 700; font-size: 0.83rem; color: white; margin-bottom: 2px; }
        .toast-msg { font-size: 0.76rem; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast-close {
            background: none; border: none; color: rgba(255,255,255,0.3);
            cursor: pointer; font-size: 0.95rem; padding: 2px; flex-shrink: 0;
        }
        .toast-close:hover { color: rgba(255,255,255,0.7); }
        @keyframes toastIn  { from{opacity:0;transform:translateX(45px) scale(0.92)} to{opacity:1;transform:translateX(0) scale(1)} }
        @keyframes toastOut { from{opacity:1;transform:translateX(0) scale(1)}       to{opacity:0;transform:translateX(45px) scale(0.9)} }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .messenger-wrap { top: 62px; padding: 0; gap: 0; flex-direction: column; }
            .sidebar        { width: 100%; border-radius: 0; border: none; border-bottom: 1px solid rgba(255,255,255,0.07); }
            .chat-window    { border-radius: 0; border: none; display: none; }
            .messenger-wrap.chat-active .sidebar      { display: none; }
            .messenger-wrap.chat-active .chat-window  { display: flex; flex: 1; }
            .back-btn { display: flex !important; }
            .chat-messages { padding: 14px 16px; }
            .bubble { max-width: 82%; }
            #inboxToastContainer { bottom: 14px; right: 14px; max-width: calc(100vw - 28px); }
        }
    </style>
</head>
<body>

<header class="navbar" id="navbar">
    <div class="logo">LostLink</div>
    <nav class="nav-links"><!-- session.js --></nav>
</header>

<div class="messenger-wrap" id="messengerWrap">

    <!-- ── SIDEBAR ── -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <span class="sidebar-title">Messages</span>
                <button class="compose-btn" title="New message">✏️</button>
            </div>
            <div class="search-wrap">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input class="search-input" id="searchInput" type="text" placeholder="Search conversations…" autocomplete="off">
            </div>
        </div>
        <div class="chats-list" id="chatsList">
            <div style="padding:28px;text-align:center;opacity:0.3;font-size:0.85rem;">Loading…</div>
        </div>
    </div>

    <!-- ── CHAT WINDOW ── -->
    <div class="chat-window" id="chatWindow">

        <!-- Empty state -->
        <div class="no-chat" id="noChatSelected">
            <div class="no-chat-icon">💬</div>
            <h3>Your Conversations</h3>
            <p>Pick a chat from the sidebar to start messaging</p>
        </div>

        <!-- Active chat -->
        <div id="activeChat">
            <div class="chat-header">
                <div class="chat-header-left">
                    <button class="back-btn" id="backBtn" onclick="closeChat()" title="Back">←</button>
                    <div class="header-avatar-wrap" id="headerAvatarWrap">
                        <div class="header-avatar" id="activeAvatar">?</div>
                    </div>
                    <div class="header-info">
                        <h4 id="activeName">—</h4>
                        <div class="header-status offline" id="activeStatus">Offline</div>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="messageFlow"></div>

            <!-- Typing indicator (inside the flow visually, but outside for layout) -->
            <div class="typing-row" id="typingRow">
                <div class="typing-bubble">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <form class="chat-input-area" onsubmit="sendMessage(event)" autocomplete="off">
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="Message…" maxlength="2000" autocomplete="off">
                    <button type="submit" class="send-btn" title="Send">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="inboxToastContainer"></div>

<script src="js/supabase.js"></script>
<script src="js/crypto.js"></script>
<script src="js/session.js"></script>
<script>
'use strict';

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let currentUser       = null;
let activeRecipientId = null;
let globalInboxSub    = null;   // postgres INSERT — all incoming
let activeChatSub     = null;   // postgres INSERT + broadcast (typing, read) — active conversation

const onlineUsers  = new Set();   // Supabase Presence — actually-online UIDs
let presenceSub    = null;

const sidebarMap      = {};       // uid → { name, lastMsg, lastTime, unreadCount, element }
const renderedMsgIds  = new Set();
let lastRenderedDate  = null;

let typingTimer = null;
let iAmTyping   = false;         // am I currently broadcasting "typing"?

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
    await SessionManager.initialize();
    if (!SessionManager.isLoggedIn()) { window.location.href = 'login.html'; return; }
    currentUser = SessionManager.currentUser;

    // Reset bell — we're ON the inbox page; bell fires only for real-time arrivals
    if (typeof SessionManager !== 'undefined') {
        SessionManager.unreadCount = 0;
        SessionManager.unreadMessages = [];
        SessionManager.updateBadgeUI?.();
    }

    await loadConversations();        // populate sidebar
    startGlobalInboxListener();       // watch all incoming messages
    initPresence();                   // real online status

    document.getElementById('searchInput').addEventListener('input', filterSidebar);
    document.getElementById('messageInput').addEventListener('input', onInputChange);

    const params     = new URLSearchParams(window.location.search);
    const startWith  = params.get('user_id');
    if (startWith) openChat(startWith, params.get('name') || 'User');
});

/* ══════════════════════════════════════════════════════
   SUPABASE PRESENCE — real online / offline status
   Only users who have messages.html open are tracked.
══════════════════════════════════════════════════════ */
function initPresence() {
    presenceSub = supabase.channel('lostlink_presence', {
        config: { presence: { key: currentUser.id } }
    })
    .on('presence', { event: 'sync' }, () => {
        onlineUsers.clear();
        const state = presenceSub.presenceState();
        Object.keys(state).forEach(uid => onlineUsers.add(uid));
        _refreshAllOnlineUI();
    })
    .on('presence', { event: 'join' }, ({ key }) => {
        onlineUsers.add(key);
        _refreshAllOnlineUI();
    })
    .on('presence', { event: 'leave' }, ({ key }) => {
        onlineUsers.delete(key);
        _refreshAllOnlineUI();
    })
    .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
            await presenceSub.track({ user_id: currentUser.id, at: Date.now() });
        }
    });
}

function _refreshAllOnlineUI() {
    // Sidebar dots
    Object.keys(sidebarMap).forEach(uid => renderSidebarItem(uid));
    // Header status for open chat
    if (activeRecipientId) _updateHeaderStatus();
}

function _updateHeaderStatus(isTypingNow = false) {
    const statusEl = document.getElementById('activeStatus');
    const wrapEl   = document.getElementById('headerAvatarWrap');
    if (!statusEl || !activeRecipientId) return;

    if (isTypingNow) {
        statusEl.textContent = 'typing…';
        statusEl.className   = 'header-status typing';
        wrapEl.classList.add('online');
    } else if (onlineUsers.has(activeRecipientId)) {
        statusEl.textContent = 'Online';
        statusEl.className   = 'header-status online';
        wrapEl.classList.add('online');
    } else {
        statusEl.textContent = 'Offline';
        statusEl.className   = 'header-status offline';
        wrapEl.classList.remove('online');
    }
}

/* ══════════════════════════════════════════════════════
   GLOBAL INBOX LISTENER
   Watches ALL incoming messages. Does NOT fire for active chat
   (that's handled by activeChatSub to avoid duplicates).
══════════════════════════════════════════════════════ */
function startGlobalInboxListener() {
    if (globalInboxSub) supabase.removeChannel(globalInboxSub);

    globalInboxSub = supabase
        .channel('global_inbox_' + currentUser.id)
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'messages',
            filter: `receiver_id=eq.${currentUser.id}`
        }, async (payload) => {
            const msg      = payload.new;
            const senderId = msg.sender_id;

            // If the active chat channel will handle this, skip here
            if (senderId === activeRecipientId) return;

            // Decrypt
            const plaintext = await MsgCrypto.decryptMessage(msg.content, msg.sender_id, msg.receiver_id);

            // Bump sidebar
            if (sidebarMap[senderId]) {
                sidebarMap[senderId].unreadCount++;
                refreshSidebarItem(senderId, plaintext, msg.created_at);
                bumpToTop(senderId);
            } else {
                const { data: p } = await supabase.from('profiles').select('full_name').eq('id', senderId).single();
                addSidebarItem(senderId, p?.full_name || 'Community Member', plaintext, msg.created_at, 1);
                bumpToTop(senderId);
            }

            // Bell badge
            if (typeof SessionManager !== 'undefined') {
                SessionManager.unreadCount = (SessionManager.unreadCount || 0) + 1;
                SessionManager.updateBadgeUI?.();
            }
            showInboxToast(sidebarMap[senderId]?.name || 'Someone', plaintext, senderId);
        })
        .subscribe();
}

/* ══════════════════════════════════════════════════════
   LOAD CONVERSATIONS — populate sidebar
══════════════════════════════════════════════════════ */
async function loadConversations() {
    const { data: messages, error } = await supabase
        .from('messages')
        .select('*')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .order('created_at', { ascending: false });

    if (error) { console.error(error); return; }

    const chatsList = document.getElementById('chatsList');
    chatsList.innerHTML = '';

    const convMap   = {};
    const unreadMap = {};
    (messages || []).forEach(msg => {
        const peer = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id;
        if (!convMap[peer]) convMap[peer] = msg;
        if (msg.sender_id !== currentUser.id && !msg.is_read) {
            unreadMap[peer] = (unreadMap[peer] || 0) + 1;
        }
    });

    const peerIds = Object.keys(convMap);
    if (!peerIds.length) {
        chatsList.innerHTML = `
            <div class="empty-sidebar">
                <span>💬</span><p>No conversations yet.<br>Message someone from Community!</p>
            </div>`;
        return;
    }

    const { data: profiles } = await supabase.from('profiles').select('id,full_name').in('id', peerIds);
    const profileMap = {};
    (profiles || []).forEach(p => profileMap[p.id] = p.full_name);

    peerIds.sort((a, b) => new Date(convMap[b].created_at) - new Date(convMap[a].created_at));

    // Decrypt previews in parallel (keys are cached after first use)
    await Promise.all(peerIds.map(async uid => {
        const msg     = convMap[uid];
        const name    = profileMap[uid] || 'Community Member';
        const preview = await MsgCrypto.decryptMessage(msg.content, msg.sender_id, msg.receiver_id);
        addSidebarItem(uid, name, preview, msg.created_at, unreadMap[uid] || 0);
    }));
}

/* ══════════════════════════════════════════════════════
   SIDEBAR HELPERS
══════════════════════════════════════════════════════ */
function addSidebarItem(uid, name, lastMsg, lastTime, unreadCount = 0) {
    if (sidebarMap[uid]) { refreshSidebarItem(uid, lastMsg, lastTime); return; }

    const item = document.createElement('div');
    item.className   = 'chat-item';
    item.dataset.uid = uid;
    item.onclick     = () => openChat(uid, name);

    const chatsList = document.getElementById('chatsList');
    const empty     = chatsList.querySelector('.empty-sidebar');
    if (empty) empty.remove();
    chatsList.appendChild(item);

    sidebarMap[uid] = { name, lastMsg, lastTime, unreadCount, element: item };
    renderSidebarItem(uid);
}

function renderSidebarItem(uid) {
    const e = sidebarMap[uid];
    if (!e) return;
    const { name, lastMsg, lastTime, unreadCount, element } = e;
    const isActive = uid === activeRecipientId;
    const isOnline = onlineUsers.has(uid);

    element.className = 'chat-item' + (isActive ? ' active' : '');
    element.innerHTML = `
        <div class="ci-avatar-wrap">
            <div class="ci-avatar">${name.charAt(0).toUpperCase()}</div>
            <div class="ci-online-dot${isOnline ? ' visible' : ''}"></div>
        </div>
        <div class="ci-body">
            <div class="ci-top">
                <span class="ci-name">${escHtml(name)}</span>
                <span class="ci-time">${fmtTime(lastTime)}</span>
            </div>
            <div class="ci-bottom">
                <span class="ci-preview${unreadCount > 0 && !isActive ? ' unread' : ''}">${escHtml(lastMsg || '')}</span>
                ${unreadCount > 0 && !isActive
                    ? `<span class="ci-badge">${unreadCount > 99 ? '99+' : unreadCount}</span>` : ''}
            </div>
        </div>`;
}

function refreshSidebarItem(uid, newMsg, newTime) {
    if (!sidebarMap[uid]) return;
    sidebarMap[uid].lastMsg  = newMsg;
    if (newTime) sidebarMap[uid].lastTime = newTime;
    renderSidebarItem(uid);
}

function bumpToTop(uid) {
    if (!sidebarMap[uid]) return;
    document.getElementById('chatsList').prepend(sidebarMap[uid].element);
}

function filterSidebar() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    Object.entries(sidebarMap).forEach(([, entry]) => {
        const match = entry.name.toLowerCase().includes(q) || (entry.lastMsg || '').toLowerCase().includes(q);
        entry.element.style.display = match ? '' : 'none';
    });
}

/* ══════════════════════════════════════════════════════
   OPEN CHAT
══════════════════════════════════════════════════════ */
async function openChat(recipientId, name) {
    // Stop broadcasting "typing" if we switch chats
    if (iAmTyping) { iAmTyping = false; clearTimeout(typingTimer); _broadcastTyping(false); }

    activeRecipientId = recipientId;

    document.getElementById('noChatSelected').style.display = 'none';
    document.getElementById('activeChat').style.display     = 'flex';
    document.getElementById('activeName').textContent       = name;
    document.getElementById('activeAvatar').textContent     = name.charAt(0).toUpperCase();
    document.getElementById('messengerWrap').classList.add('chat-active');
    _showTyping(false);
    _updateHeaderStatus();

    // Clear unread badge in sidebar
    if (!sidebarMap[recipientId]) addSidebarItem(recipientId, name, '', new Date().toISOString(), 0);
    sidebarMap[recipientId].unreadCount = 0;
    Object.keys(sidebarMap).forEach(uid => renderSidebarItem(uid));

    // Reset message flow
    lastRenderedDate = null;
    renderedMsgIds.clear();
    document.getElementById('messageFlow').innerHTML = '';

    // Load history
    await loadMessages(recipientId);

    // Broadcast "I read your messages" to the other user
    _broadcastRead();

    // ── Per-conversation channel: postgres_changes + broadcast (typing, read) ──
    if (activeChatSub) supabase.removeChannel(activeChatSub);
    const [a, b] = [currentUser.id, recipientId].sort();

    activeChatSub = supabase
        .channel(`conv_${a}_${b}`)
        // New messages from the other person
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'messages',
            filter: `receiver_id=eq.${currentUser.id}`
        }, async (payload) => {
            const msg = payload.new;
            if (msg.sender_id !== recipientId) return;

            const plaintext = await MsgCrypto.decryptMessage(msg.content, msg.sender_id, msg.receiver_id);
            appendBubble({ ...msg, content: plaintext }, 'received');
            refreshSidebarItem(recipientId, plaintext, msg.created_at);
            bumpToTop(recipientId);
            _showTyping(false);
            _broadcastRead();  // tell sender we read it immediately
            try { await supabase.from('messages').update({ is_read: true }).eq('id', msg.id); } catch (_) {}
        })
        // Typing events from the other person
        .on('broadcast', { event: 'typing' }, (payload) => {
            if (payload.payload?.user_id === recipientId) {
                _showTyping(payload.payload.typing);
                _updateHeaderStatus(payload.payload.typing);
            }
        })
        // Read receipt — other person has read our messages
        .on('broadcast', { event: 'read' }, (payload) => {
            if (payload.payload?.reader_id === recipientId) {
                _updateAllTicksToRead();
            }
        })
        .subscribe();

    document.getElementById('messageInput').focus();
}

/* ══════════════════════════════════════════════════════
   LOAD MESSAGES (history)
══════════════════════════════════════════════════════ */
async function loadMessages(recipientId) {
    const { data: messages } = await supabase
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${recipientId}),and(sender_id.eq.${recipientId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

    // Decrypt all in parallel (single PBKDF2 call per pair due to cache)
    await MsgCrypto.decryptMessages(messages || []);

    (messages || []).forEach(msg =>
        appendBubble(msg, msg.sender_id === currentUser.id ? 'sent' : 'received')
    );
    scrollToBottom();

    // Mark received messages as read in DB
    try {
        await supabase.from('messages').update({ is_read: true })
            .eq('sender_id', recipientId).eq('receiver_id', currentUser.id).eq('is_read', false);
    } catch (_) {}

    // Reduce nav bell count for this sender
    if (typeof SessionManager !== 'undefined' && SessionManager.unreadMessages) {
        const prev = SessionManager.unreadMessages.length;
        SessionManager.unreadMessages = SessionManager.unreadMessages.filter(m => m.sender_id !== recipientId);
        const removed = prev - SessionManager.unreadMessages.length;
        if (removed > 0) {
            SessionManager.unreadCount = Math.max(0, (SessionManager.unreadCount || 0) - removed);
            SessionManager.updateBadgeUI?.();
        }
    }
}

/* ══════════════════════════════════════════════════════
   APPEND BUBBLE — dedup, date separators, grouping, ticks
══════════════════════════════════════════════════════ */
function appendBubble(msg, type) {
    if (renderedMsgIds.has(msg.id)) return;
    renderedMsgIds.add(msg.id);

    const flow    = document.getElementById('messageFlow');
    const msgDate = new Date(msg.created_at).toDateString();

    // Date separator
    if (msgDate !== lastRenderedDate) {
        lastRenderedDate = msgDate;
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.innerHTML = `<span>${formatDateLabel(msg.created_at)}</span>`;
        flow.appendChild(sep);
    }

    // Group logic: can we append to the last group?
    const lastChild  = flow.lastElementChild;
    const GROUP_GAP  = 120_000; // 2 minutes
    const canGroup   = lastChild &&
        lastChild.classList.contains('msg-group') &&
        lastChild.classList.contains(type) &&
        (new Date(msg.created_at) - new Date(lastChild.dataset.lastTime || 0)) < GROUP_GAP;

    let group;
    if (canGroup) {
        group = lastChild;
        // Remove the old meta row before adding next bubble
        const oldMeta = group.querySelector('.bubble-meta');
        if (oldMeta) oldMeta.remove();
    } else {
        group = document.createElement('div');
        group.className = `msg-group ${type}`;
        flow.appendChild(group);
    }
    group.dataset.lastTime = msg.created_at;

    // Bubble
    const bubble = document.createElement('div');
    bubble.className    = `bubble ${type}`;
    bubble.dataset.msgId = msg.id;
    bubble.textContent  = msg.content;
    group.appendChild(bubble);

    // Meta row (time + tick for sent)
    const meta    = document.createElement('div');
    meta.className = 'bubble-meta';
    const timeStr  = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (type === 'sent') {
        const tickClass = msg._pending ? 'pending' : (msg.is_read ? 'read' : 'sent');
        const tickText  = msg._pending ? '○' : (msg.is_read ? '✓✓' : '✓');
        meta.innerHTML  = `<span class="bubble-time">${timeStr}</span><span class="msg-tick ${tickClass}">${tickText}</span>`;
    } else {
        meta.innerHTML = `<span class="bubble-time">${timeStr}</span>`;
    }
    group.appendChild(meta);

    scrollToBottom();
}

/* ══════════════════════════════════════════════════════
   SEND MESSAGE — optimistic UI (shows instantly, confirms async)
══════════════════════════════════════════════════════ */
async function sendMessage(e) {
    e.preventDefault();
    const input     = document.getElementById('messageInput');
    const plaintext = input.value.trim();
    if (!plaintext || !activeRecipientId) return;
    input.value = '';

    // Stop typing broadcast
    iAmTyping = false;
    clearTimeout(typingTimer);
    _broadcastTyping(false);

    // ── 1. Show optimistically RIGHT NOW ──
    const tempId  = 'opt_' + Date.now();
    appendBubble({
        id: tempId, content: plaintext,
        sender_id: currentUser.id, receiver_id: activeRecipientId,
        created_at: new Date().toISOString(), is_read: false, _pending: true
    }, 'sent');
    refreshSidebarItem(activeRecipientId, plaintext, new Date().toISOString());
    bumpToTop(activeRecipientId);

    // ── 2. Encrypt + persist ──
    let ciphertext;
    try {
        ciphertext = await MsgCrypto.encryptMessage(plaintext, currentUser.id, activeRecipientId);
    } catch (err) {
        console.error('Encryption error', err);
        _markBubbleFailed(tempId);
        return;
    }

    const { data, error } = await supabase
        .from('messages')
        .insert([{ sender_id: currentUser.id, receiver_id: activeRecipientId, content: ciphertext }])
        .select();

    // ── 3. Update optimistic bubble ──
    if (!error && data?.[0]) {
        const tempBubble = document.querySelector(`[data-msg-id="${tempId}"]`);
        if (tempBubble) {
            renderedMsgIds.delete(tempId);
            renderedMsgIds.add(data[0].id);
            tempBubble.dataset.msgId = data[0].id;
            // Pending ○ → Sent ✓
            const tickEl = tempBubble.closest('.msg-group')?.querySelector('.msg-tick');
            if (tickEl) { tickEl.className = 'msg-tick sent'; tickEl.textContent = '✓'; }
        }
    } else if (error) {
        _markBubbleFailed(tempId);
    }
}

function _markBubbleFailed(msgId) {
    const bubble = document.querySelector(`[data-msg-id="${msgId}"]`);
    if (!bubble) return;
    bubble.classList.add('failed');
    const tick = bubble.closest('.msg-group')?.querySelector('.msg-tick');
    if (tick) { tick.className = 'msg-tick'; tick.textContent = '✕'; tick.title = 'Failed to send'; }
}

/* ══════════════════════════════════════════════════════
   TYPING — broadcast + display
══════════════════════════════════════════════════════ */
function onInputChange() {
    if (!activeRecipientId || !activeChatSub) return;
    if (!iAmTyping) { iAmTyping = true; _broadcastTyping(true); }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { iAmTyping = false; _broadcastTyping(false); }, 2000);
}

function _broadcastTyping(typing) {
    if (!activeChatSub) return;
    activeChatSub.send({ type: 'broadcast', event: 'typing', payload: { user_id: currentUser.id, typing } })
        .catch(() => {});
}

function _showTyping(visible) {
    const el = document.getElementById('typingRow');
    if (!el) return;
    el.classList.toggle('visible', visible);
    if (visible) scrollToBottom();
}

/* ══════════════════════════════════════════════════════
   READ RECEIPTS — broadcast + update ticks
══════════════════════════════════════════════════════ */
function _broadcastRead() {
    if (!activeChatSub || !activeRecipientId) return;
    activeChatSub.send({ type: 'broadcast', event: 'read', payload: { reader_id: currentUser.id } })
        .catch(() => {});
}

function _updateAllTicksToRead() {
    document.querySelectorAll('#messageFlow .msg-tick.sent').forEach(tick => {
        tick.className   = 'msg-tick read';
        tick.textContent = '✓✓';
    });
}

/* ══════════════════════════════════════════════════════
   CLOSE CHAT — mobile back
══════════════════════════════════════════════════════ */
function closeChat() {
    if (iAmTyping) { iAmTyping = false; clearTimeout(typingTimer); _broadcastTyping(false); }
    document.getElementById('messengerWrap').classList.remove('chat-active');
    document.getElementById('noChatSelected').style.display = '';
    document.getElementById('activeChat').style.display     = 'none';
    activeRecipientId = null;
    window.history.pushState({}, document.title, window.location.pathname);
    Object.keys(sidebarMap).forEach(uid => renderSidebarItem(uid));
}

/* ══════════════════════════════════════════════════════
   IN-PAGE TOAST
══════════════════════════════════════════════════════ */
function showInboxToast(senderName, text, senderId) {
    const container = document.getElementById('inboxToastContainer');
    const toast     = document.createElement('div');
    toast.className = 'inbox-toast';
    toast.innerHTML = `
        <div class="toast-av">${senderName.charAt(0).toUpperCase()}</div>
        <div class="toast-body">
            <div class="toast-name">💬 ${escHtml(senderName)}</div>
            <div class="toast-msg">${escHtml(text)}</div>
        </div>
        <button class="toast-close" onclick="event.stopPropagation();_dismissToast(this)">✕</button>`;
    toast.onclick = () => { openChat(senderId, senderName); toast.remove(); };
    container.prepend(toast);
    setTimeout(() => _dismissToast(toast, true), 5000);
}

function _dismissToast(el, byTimer = false) {
    const toast = byTimer ? el : el.closest('.inbox-toast');
    if (!toast?.isConnected) return;
    toast.style.animation = 'toastOut .28s ease forwards';
    setTimeout(() => toast.remove(), 280);
}

/* ══════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════ */
function scrollToBottom() {
    const f = document.getElementById('messageFlow');
    if (f) f.scrollTop = f.scrollHeight;
}

function escHtml(str) {
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtTime(iso) {
    if (!iso) return '';
    const d    = new Date(iso);
    const diff = Math.floor((Date.now() - d) / 86400000);
    if (diff === 0) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diff === 1) return 'Yesterday';
    if (diff < 7)  return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatDateLabel(iso) {
    const d    = new Date(iso);
    const diff = Math.floor((Date.now() - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7)  return d.toLocaleDateString([], { weekday: 'long' });
    return d.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
}
