<!DOCTYPE html>
<html lang="en">
<head>
    <title>LostLink Inbox | LostLink</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css?v=1.3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        /* MESSAGING LAYOUT */
        .messenger-container {
            flex: 1;
            display: flex;
            max-width: 1400px;
            margin: 100px auto 20px;
            width: 95%;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        /* SIDEBAR */
        .sidebar {
            width: 350px;
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-header {
            padding: 25px;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            margin-left: 10px;
            outline: none;
            width: 100%;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .chat-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .chat-item.active {
            background: rgba(102, 126, 234, 0.2);
            border-left: 4px solid var(--accent);
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            background: var(--primary-gradient);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .chat-info h4 {
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .chat-info p {
            font-size: 0.8rem;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* CHAT WINDOW */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.1);
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            position: relative;
            line-height: 1.5;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 5px;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary-gradient);
            border-bottom-right-radius: 5px;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.5;
            display: block;
            text-align: right;
        }

        /* INPUT AREA */
        .chat-input-area {
            padding: 25px 30px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--glass-border);
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.1);
        }

        .send-btn {
            background: var(--primary-gradient);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .send-btn:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        /* EMPTY STATE */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
        }

        .empty-chat span {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        /* MOBILE & TABLET RESPONSIVE MESSENGER */
        @media (max-width: 768px) {
            html, body {
                height: 100dvh !important;
                overflow: hidden !important;
            }

            .navbar {
                padding: 15px 20px;
            }

            .messenger-container {
                margin: 70px 0 0 0;
                width: 100%;
                height: calc(100dvh - 70px);
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                display: flex;
            }

            .chat-window {
                width: 100%;
                display: none;
                height: 100%;
                overflow: hidden;
                flex-direction: column !important;
            }

            #activeChat {
                height: 100% !important;
                flex-direction: column !important;
                overflow: hidden !important;
            }

            /* Toggle visibility when a chat is active */
            .messenger-container.chat-active .sidebar {
                display: none;
            }

            .messenger-container.chat-active .chat-window {
                display: flex;
            }

            /* Adjust paddings and sizes for mobile */
            .chat-header {
                padding: 15px 20px;
            }

            .chat-messages {
                padding: 15px !important;
                gap: 15px;
                flex: 1 !important;
                overflow-y: auto !important;
            }

            .chat-input-area {
                padding: 12px 15px !important;
                background: rgba(0, 0, 0, 0.4) !important;
            }

            .message {
                max-width: 85%;
                padding: 10px 15px;
                font-size: 0.9rem;
            }

            .sidebar-header {
                padding: 20px;
            }

            .chat-item {
                padding: 15px 20px;
            }

            .back-btn {
                display: inline-flex !important;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">LostLink</div>
        <nav class="nav-links">
            <!-- Populated by session.js -->
        </nav>
    </header>

    <div class="messenger-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Messages</h2>
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search conversations...">
                </div>
            </div>
            <div class="chats-list" id="chatsList">
                <!-- Chat items will be loaded here -->
                <div style="padding: 20px; text-align: center; opacity: 0.5;">Loading chats...</div>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="chat-window">
            <div id="activeChat" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button type="button" class="back-btn" onclick="closeChat()" style="display: none; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding-right: 10px; align-items: center; justify-content: center;">←</button>
                        <div class="chat-avatar" id="activeAvatar">👤</div>
                        <div>
                            <h4 id="activeName">Select a contact</h4>
                            <p style="font-size: 0.8rem; opacity: 0.6;" id="activeStatus">Online</p>
                        </div>
                    </div>
                </div>

                <div class="chat-messages" id="messageFlow">
                    <!-- Messages will be loaded here -->
                </div>

                <form class="chat-input-area" onsubmit="sendMessage(event)">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Type your message here..." autocomplete="off">
                        <button type="submit" class="send-btn">✈️</button>
                    </div>
                </form>
            </div>

            <div id="noChatSelected" class="empty-chat">
                <span>💬</span>
                <h3>Your Conversations</h3>
                <p>Select a chat to start messaging</p>
            </div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/session.js"></script>
    <script>
        let currentUser = null;
        let activeRecipientId = null;
        let activeChatSubscription = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await SessionManager.initialize();
            if (!SessionManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = SessionManager.currentUser;
            loadConversations();
            
            // Check for URL parameters (e.g. starting a new chat)
            const params = new URLSearchParams(window.location.search);
            const startChatWith = params.get('user_id');
            if (startChatWith) {
                openChat(startChatWith, params.get('name') || 'User');
            }
        });

        async function loadConversations() {
            const { data: messages, error } = await supabase
                .from('messages')
                .select('*')
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                .order('created_at', { ascending: false });

            if (error) return console.error(error);

            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';

            const conversations = {};
            messages.forEach(msg => {
                const otherId = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id;
                if (!conversations[otherId]) {
                    conversations[otherId] = msg;
                }
            });

            const userIds = Object.keys(conversations);
            if (userIds.length === 0) {
                chatsList.innerHTML = '<div style="padding: 40px; text-align: center; opacity: 0.5;">No messages yet.</div>';
                return;
            }

            // Get profile info for users
            const { data: profiles } = await supabase
                .from('profiles')
                .select('*')
                .in('id', userIds);

            userIds.forEach(uid => {
                const profile = profiles?.find(p => p.id === uid);
                const lastMsg = conversations[uid];
                const name = profile?.full_name || 'Community Member';
                
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openChat(uid, name);
                item.innerHTML = `
                    <div class="chat-avatar">${name.charAt(0)}</div>
                    <div class="chat-info">
                        <h4>${name}</h4>
                        <p>${lastMsg.content}</p>
                    </div>
                `;
                chatsList.appendChild(item);
            });
        }

        async function openChat(recipientId, name) {
            activeRecipientId = recipientId;
            document.getElementById('noChatSelected').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';
            document.getElementById('activeName').textContent = name;
            document.getElementById('activeAvatar').textContent = name.charAt(0);
            
            // Set mobile active panel state
            document.querySelector('.messenger-container').classList.add('chat-active');
            
            // Check if user is already in sidebar
            const existingChat = Array.from(document.querySelectorAll('.chat-info h4'))
                .find(h4 => h4.textContent === name);
            
            if (!existingChat) {
                const chatsList = document.getElementById('chatsList');
                // Remove the "No messages yet" placeholder if it exists
                if (chatsList.innerText.includes('No messages yet')) chatsList.innerHTML = '';
                
                const item = document.createElement('div');
                item.className = 'chat-item active';
                item.innerHTML = `
                    <div class="chat-avatar">${name.charAt(0)}</div>
                    <div class="chat-info">
                        <h4>${name}</h4>
                        <p>New conversation</p>
                    </div>
                `;
                chatsList.prepend(item);
            }

            // Highlight active chat
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('h4').textContent === name) item.classList.add('active');
            });
            
            // Load messages
            loadMessages(recipientId);

            // Subscribe to real-time updates for this recipient
            if (activeChatSubscription) supabase.removeChannel(activeChatSubscription);
            
            activeChatSubscription = supabase.channel(`chat_${recipientId}`)
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'messages',
                    filter: `receiver_id=eq.${currentUser.id}`
                }, async (payload) => {
                    const msg = payload.new;
                    if (msg.sender_id === recipientId) {
                        appendMessage(msg, 'received');
                        
                        // Mark as read in DB immediately
                        try {
                            await supabase
                                .from('messages')
                                .update({ is_read: true })
                                .eq('id', msg.id);
                        } catch (e) {
                            console.error('Error marking message as read:', e);
                        }
                    }
                })
                .subscribe();
        }

        async function loadMessages(recipientId) {
            const { data: messages, error } = await supabase
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${recipientId}),and(sender_id.eq.${recipientId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const flow = document.getElementById('messageFlow');
            flow.innerHTML = '';
            messages?.forEach(msg => {
                const type = msg.sender_id === currentUser.id ? 'sent' : 'received';
                appendMessage(msg, type);
            });
            flow.scrollTop = flow.scrollHeight;

            // Mark received messages as read in DB
            try {
                await supabase
                    .from('messages')
                    .update({ is_read: true })
                    .eq('sender_id', recipientId)
                    .eq('receiver_id', currentUser.id)
                    .eq('is_read', false);
            } catch (e) {
                console.warn('DB error marking read:', e);
            }

            // Sync navbar notifications count locally
            if (typeof SessionManager !== 'undefined' && SessionManager.unreadMessages) {
                const prevLength = SessionManager.unreadMessages.length;
                SessionManager.unreadMessages = SessionManager.unreadMessages.filter(msg => msg.sender_id !== recipientId);
                const removedCount = prevLength - SessionManager.unreadMessages.length;
                if (removedCount > 0) {
                    SessionManager.unreadCount = Math.max(0, SessionManager.unreadCount - removedCount);
                    SessionManager.updateBadgeUI();
                }
            }
        }

        function appendMessage(msg, type) {
            const flow = document.getElementById('messageFlow');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                ${msg.content}
                <span class="message-time">${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            `;
            flow.appendChild(div);
            flow.scrollTop = flow.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !activeRecipientId) return;

            const { data, error } = await supabase
                .from('messages')
                .insert([{
                    sender_id: currentUser.id,
                    receiver_id: activeRecipientId,
                    content: content
                }])
                .select();

            if (!error) {
                appendMessage(data[0], 'sent');
                input.value = '';
            }
        }

        function closeChat() {
            document.querySelector('.messenger-container').classList.remove('chat-active');
            activeRecipientId = null;
            // Clear URL search params so returning to list is clean
            window.history.pushState({}, document.title, window.location.pathname);
            
            // Remove active highlighting from sidebar chats
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
        }
    </script>
</body>
</html>
