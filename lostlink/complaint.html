<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File a Complaint | LostLink</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="stylesheet" href="css/dark-override.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .complaint-container {
            max-width: 600px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }

        .form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group textarea {
            height: 150px;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--accent), #ff6b6b);
            color: #1e1b4b;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 211, 105, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .message.success {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
            display: block;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
            display: block;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">LostLink</div>
        <nav class="nav-links">
            <!-- Populated by session.js -->
        </nav>
    </header>

    <div class="complaint-container">
        <div class="form-card">
            <div class="form-header">
                <h1>Submit a Complaint</h1>
                <p>Have an issue? Let us know and we'll look into it.</p>
            </div>

            <div id="message" class="message"></div>

            <form id="complaintForm">
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="What is this about?" required>
                </div>
                <div class="form-group">
                    <label for="description">Detailed Description</label>
                    <textarea id="description" placeholder="Please provide as much detail as possible..." required></textarea>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Submit Complaint</button>
            </form>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/session.js"></script>
    <script>
        document.getElementById('complaintForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            const subject = document.getElementById('subject').value.trim();
            const description = document.getElementById('description').value.trim();
            const userId = SessionManager.getUserId();

            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            messageDiv.style.display = 'none';

            try {
                const { error } = await supabase
                    .from('complaints')
                    .insert([
                        { 
                            user_id: userId,
                            subject: subject,
                            description: description,
                            status: 'pending'
                        }
                    ]);

                if (error) throw error;

                // Success
                messageDiv.textContent = 'Complaint submitted successfully! We will review it shortly.';
                messageDiv.className = 'message success';
                document.getElementById('complaintForm').reset();
            } catch (error) {
                console.error('Error submitting complaint:', error);
                messageDiv.textContent = 'Failed to submit complaint: ' + error.message;
                messageDiv.className = 'message error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Complaint';
            }
        });
    </script>
</body>
</html>
