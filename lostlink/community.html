<!DOCTYPE html>
<html lang="en">
<head>
<title>Community | LostLink</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css?v=2.0">
<link rel="stylesheet" href="css/dark-override.css?v=2.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-attachment: fixed;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ANIMATED BACKGROUND */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="40" cy="80" r="1.5" fill="rgba(255,255,255,0.08)"/><circle cx="60" cy="10" r="1" fill="rgba(255,255,255,0.06)"/><circle cx="10" cy="60" r="1.2" fill="rgba(255,255,255,0.07)"/></svg>');
    animation: float 25s ease-in-out infinite;
    z-index: -1;
}

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    33% { transform: translateY(-15px) rotate(120deg); }
    66% { transform: translateY(15px) rotate(240deg); }
}

/* DARK MODE */
.dark {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #e8e8e8;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    animation: slideDown 1s ease-out;
}

@keyframes slideDown {
    from { transform: translateY(-100px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.logo {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(45deg, #ffd369, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-links a {
    text-decoration: none;
    color: white;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
}

.nav-links a::before {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(45deg, #ffd369, #ff6b6b);
    transition: width 0.3s ease;
}

.nav-links a:hover::before {
    width: 100%;
}

.nav-links a:hover {
    color: #ffd369;
    transform: translateY(-2px);
}

/* MAIN CONTENT */
.main {
    padding: 120px 40px 40px;
    max-width: 1200px;
    margin: 0 auto;
}

/* HEADER */
.community-header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeInUp 1s ease-out;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.community-header h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(45deg, #ffffff, #ffd369);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.community-header p {
    font-size: 1.2rem;
    opacity: 0.9;
    margin-bottom: 30px;
}

/* FILTERS */
.filters {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 12px 24px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.filter-btn:hover,
.filter-btn.active {
    background: linear-gradient(45deg, #ffd369, #ff6b6b);
    border-color: #ffd369;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 211, 105, 0.3);
}

/* POST FEED */
.feed {
    display: grid;
    gap: 30px;
}

.post-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    animation: slideIn 0.8s ease-out;
}

.post-card:hover {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
}

.post-header {
    display: flex;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.user-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(45deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-right: 15px;
    color: white;
}

.user-info h4 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 2px;
    color: #ffd369;
}

.user-info p {
    font-size: 0.9rem;
    opacity: 0.7;
}

.post-content {
    padding: 20px;
}

.post-image {
    width: 100%;
    height: 300px;
    background: linear-gradient(45deg, #667eea, #764ba2);
    border-radius: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    color: rgba(255, 255, 255, 0.7);
    overflow: hidden;
}

.post-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.post-text h3 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: white;
}

.post-text p {
    line-height: 1.6;
    opacity: 0.9;
    margin-bottom: 15px;
}

.post-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    opacity: 0.7;
    margin-bottom: 15px;
}

.post-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.action-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}

.action-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
}

.action-btn.liked {
    background: linear-gradient(45deg, #ff6b6b, #ffd369);
    color: white;
}

.like-count,
.comment-count {
    margin-left: 5px;
    font-weight: 600;
}

.claim-btn {
    background: linear-gradient(45deg, #ffd369, #ff6b6b);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.claim-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 25px rgba(255, 211, 105, 0.3);
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* LOAD MORE */
.load-more {
    text-align: center;
    margin-top: 40px;
}

.load-more-btn {
    padding: 15px 30px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.load-more-btn:hover {
    background: linear-gradient(45deg, #ffd369, #ff6b6b);
    border-color: #ffd369;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 211, 105, 0.3);
}

/* RESPONSIVE DESIGN */
@media (max-width: 768px) {
    .navbar {
        padding: 20px 20px;
    }

    .main {
        padding: 100px 20px 20px;
    }

    .community-header h1 {
        font-size: 2rem;
    }

    .filters {
        gap: 10px;
    }

    .filter-btn {
        padding: 10px 16px;
        font-size: 0.9rem;
    }

    .post-header {
        padding: 15px;
    }

    .post-content {
        padding: 15px;
    }

    .post-actions {
        padding: 12px 15px;
        flex-direction: column;
        gap: 10px;
    }

    .action-btn {
        padding: 6px 12px;
        font-size: 0.9rem;
    }
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<!-- DYNAMIC ISLAND NAVBAR -->
<header class="navbar" id="navbar">
    <div class="logo">LostLink</div>
    <nav class="nav-links"><!-- populated by session.js --></nav>
</header>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <h1>Community Feed</h1>
        <p>Help others find their belongings or report what you've found</p>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-container" style="max-width: 600px; margin: 0 auto 30px; position: relative;">
        <input type="text" id="communitySearch" placeholder="🔍 Search lost or found items..." 
               style="width: 100%; padding: 15px 25px; border-radius: 50px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; outline: none; font-size: 1.1rem;"
               oninput="handleSearch(this.value)">
    </div>

    <!-- FILTERS -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterPosts('all')">All</button>
        <button class="filter-btn" onclick="filterPosts('lost')">Lost</button>
        <button class="filter-btn" onclick="filterPosts('found')">Found</button>
        <button class="filter-btn" onclick="filterPosts('recent')">Recent</button>
    </div>

    <!-- POST FEED -->
    <div class="feed" id="feed">
        <!-- Posts will be dynamically loaded here -->
    </div>

    <!-- LOAD MORE -->
    <div class="load-more">
        <button class="load-more-btn" onclick="loadMorePosts()">Load More Posts</button>
    </div>

</div>

<script src="js/supabase.js"></script>
<script src="js/session.js"></script>
<script>

// Global variables
let allPosts = [];
let currentFilter = 'all';
let displayedPosts = 0;
const postsPerLoad = 6;

/* CHECK LOGIN ON PAGE LOAD */
document.addEventListener('DOMContentLoaded', async function() {
    if (typeof SessionManager.initialize === 'function') {
        await SessionManager.initialize();
    }
    
    if (!SessionManager.requireLogin()) {
        return; // Will redirect to login if not logged in
    }
    fetchPosts();
});

/* FETCH POSTS FROM SUPABASE */
async function fetchPosts() {
    console.log("Community Feed: Fetching posts...");
    try {
        let lostItems = [], foundItems = [];

        // Attempt 1: Fetch Lost Items
        try {
            let { data, error } = await supabase
                .from('lost_items')
                .select('*, profiles(full_name, avatar_url)')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.warn('Lost items fetch error, trying basic:', error);
                let { data: basic } = await supabase.from('lost_items').select('*').order('created_at', { ascending: false });
                lostItems = basic || [];
            } else {
                lostItems = data || [];
            }
        } catch (e) {
            lostItems = [];
        }

        // Attempt 2: Fetch Found Items
        try {
            let { data, error } = await supabase
                .from('found_items')
                .select('*, profiles(full_name, avatar_url)')
                .order('created_at', { ascending: false });

            if (error) {
                console.warn('Found items fetch error, trying basic:', error);
                let { data: basic } = await supabase.from('found_items').select('*').order('created_at', { ascending: false });
                foundItems = basic || [];
            } else {
                foundItems = data || [];
            }
        } catch (e) {
            foundItems = [];
        }

        console.log(`Feed Data: Found ${lostItems.length} lost items, ${foundItems.length} found items.`);

        // Combine and format posts
        const posts = [];
        
        if (lostItems) {
            lostItems.forEach(item => {
                posts.push({
                    id: item.id,
                    type: 'lost',
                    user: item.profiles?.full_name || 'Community Member',
                    avatar: item.profiles?.avatar_url || null,
                    title: item.name,
                    description: item.description,
                    location: item.location,
                    time: getTimeAgo(new Date(item.date_lost || item.created_at)),
                    likes: 0,
                    comments: 0,
                    image_url: item.image_url,
                    owner_id: item.user_id
                });
            });
        }

        if (foundItems) {
            foundItems.forEach(item => {
                posts.push({
                    id: item.id,
                    type: 'found',
                    user: item.profiles?.full_name || 'Community Member',
                    avatar: item.profiles?.avatar_url || null,
                    title: item.name,
                    description: item.description,
                    location: item.location,
                    time: getTimeAgo(new Date(item.date_found || item.created_at)),
                    likes: 0,
                    comments: 0,
                    image_url: item.image_url,
                    owner_id: item.user_id
                });
            });
        }

        allRawItems = [...(lostItems || []), ...(foundItems || [])];
        allPosts = posts;
        
        if (allPosts.length === 0) {
            const feed = document.getElementById('feed');
            if (feed) feed.innerHTML = '<p style="text-align: center; width: 100%; padding: 40px; opacity: 0.7;">No posts found yet. Be the first to report something!</p>';
        } else {
            loadPosts();
        }
    } catch (error) {
        console.error('Error fetching posts from Supabase:', error);
        const feed = document.getElementById('feed');
        if (feed) feed.innerHTML = '<p style="text-align: center; width: 100%; padding: 40px; opacity: 0.7;">Error loading feed. Please try again later.</p>';
    }
}

/* HELPER: GET TIME AGO */
function getTimeAgo(date) {
    if (!date || isNaN(date.getTime())) return 'Recently';
    const now = new Date();
    const diffTime = Math.abs(now - date);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays <= 1) return 'Today';
    if (diffDays < 7) return `${diffDays} days ago`;
    if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
    return `${Math.floor(diffDays / 30)} months ago`;
}

/* LOAD POSTS */
function loadPosts() {
    const feed = document.getElementById('feed');
    if (!feed) return;
    
    const filteredPosts = filterPostsData(currentFilter);
    const postsToShow = filteredPosts.slice(displayedPosts, displayedPosts + postsPerLoad);

    postsToShow.forEach(post => {
        const postElement = createPostElement(post);
        feed.appendChild(postElement);
    });

    displayedPosts += postsToShow.length;

    // Hide load more button if no more posts
    const loadMore = document.querySelector('.load-more');
    if (loadMore) {
        if (displayedPosts >= filteredPosts.length) {
            loadMore.style.display = 'none';
        } else {
            loadMore.style.display = 'block';
        }
    }
}

/* CREATE POST ELEMENT */
function createPostElement(post) {
    const postCard = document.createElement('div');
    postCard.className = 'post-card';
    postCard.dataset.type = post.type;
    postCard.dataset.id = post.id;

    // Generate avatar based on user name
    const avatar = getAvatarEmoji(post.user);

    // Get item content (image or emoji)
    const itemEmoji = getItemEmoji(post.title);
    const mediaContent = post.image_url 
        ? `<img src="${post.image_url}" alt="${post.title}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">`
        : itemEmoji;

    postCard.innerHTML = `
        <div class="post-header">
            <div class="user-avatar">${avatar}</div>
            <div class="user-info">
                <h4>${post.user}</h4>
                <p>${post.time} • ${post.location}</p>
            </div>
        </div>
        <div class="post-content">
            <div class="post-image">${mediaContent}</div>
            <div class="post-text">
                <h3>${post.title}</h3>
                <p>${post.description}</p>
                <div class="post-meta">
                    <span>📍 ${post.location}</span>
                    <span class="${post.type}">${post.type.toUpperCase()}</span>
                </div>
            </div>
        </div>
        <div class="post-actions">
            <div>
                <button class="action-btn like-btn" onclick="toggleLike(${post.id})">
                    ❤️ <span class="like-count">${post.likes || 0}</span>
                </button>
                <button class="action-btn" onclick="showComments(${post.id})">
                    💬 <span class="comment-count">${post.comments || 0}</span>
                </button>
            </div>
            ${post.type === 'found' ? `<button class="claim-btn" onclick="contactFinder('${post.owner_id}', '${post.user}')">Claim Item</button>` : `<button class="claim-btn" onclick="contactFinder('${post.owner_id}', '${post.user}')">Contact Finder</button>`}
        </div>
    `;

    return postCard;
}

/* GET AVATAR EMOJI */
function getAvatarEmoji(userName) {
    const avatars = ['👩', '👨', '👩‍💼', '👨‍🎓', '👩‍🎨', '👨‍💻', '👩‍🔬', '👨‍🏫'];
    let hash = 0;
    for (let i = 0; i < userName.length; i++) {
        hash = userName.charCodeAt(i) + ((hash << 5) - hash);
    }
    return avatars[Math.abs(hash) % avatars.length];
}

/* GET ITEM EMOJI */
function getItemEmoji(title) {
    const titleLower = title.toLowerCase();
    if (titleLower.includes('phone') || titleLower.includes('iphone')) return '📱';
    if (titleLower.includes('backpack') || titleLower.includes('bag')) return '🎒';
    if (titleLower.includes('wallet')) return '👛';
    if (titleLower.includes('watch')) return '⌚';
    if (titleLower.includes('laptop') || titleLower.includes('computer')) return '💻';
    if (titleLower.includes('charger')) return '🔌';
    if (titleLower.includes('book')) return '📚';
    if (titleLower.includes('key')) return '🔑';
    if (titleLower.includes('card')) return '💳';
    return '📦'; // Default box emoji
}

/* FILTER POSTS */
function filterPosts(filter) {
    currentFilter = filter;

    // Update active filter button
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    
    // Check if event exists (can be called from button click)
    if (window.event) {
        window.event.target.classList.add('active');
    }

    // Reset and reload posts
    displayedPosts = 0;
    const feed = document.getElementById('feed');
    if (feed) feed.innerHTML = '';
    loadPosts();
}

/* SEARCH LOGIC */
let searchText = '';

function handleSearch(val) {
    searchText = val.toLowerCase();
    const feed = document.getElementById('feed');
    if (feed) feed.innerHTML = '';
    displayedPosts = 0;
    loadPosts();
}

/* FILTER POSTS DATA */
function filterPostsData(filter) {
    let filtered = allPosts;
    
    // 1. Filter by category
    if (filter !== 'all') {
        if (filter === 'recent') {
            filtered = allPosts.slice(0, 10);
        } else {
            filtered = allPosts.filter(post => post.type === filter);
        }
    }
    
    // 2. Filter by search text
    if (searchText) {
        filtered = filtered.filter(post => 
            post.title.toLowerCase().includes(searchText) || 
            post.description.toLowerCase().includes(searchText) || 
            post.location.toLowerCase().includes(searchText)
        );
    }
    
    return filtered;
}

/* LOAD MORE POSTS */
function loadMorePosts() {
    loadPosts();
}

/* TOGGLE LIKE */
function toggleLike(postId) {
    const target = window.event.target.closest('.like-btn');
    const likeCount = target.querySelector('.like-count');
    let count = parseInt(likeCount.textContent);

    if (target.classList.contains('liked')) {
        target.classList.remove('liked');
        count--;
    } else {
        target.classList.add('liked');
        count++;
    }

    likeCount.textContent = count;
}

/* SHOW COMMENTS */
function showComments(postId) {
    alert('Comments feature coming soon! This will allow community interaction.');
}

/* CLAIM ITEM */
function claimItem(postId) {
    if (confirm('Are you sure you want to claim this item? You will need to provide proof of ownership.')) {
        alert('Claim request submitted! The item owner will contact you soon.');
    }
}

/* CONTACT FINDER */
function contactFinder(ownerId, ownerName) {
    if (!SessionManager.isLoggedIn()) {
        alert('Please login to contact the owner!');
        window.location.href = 'login.html';
        return;
    }
    
    if (ownerId === SessionManager.getUserId()) {
        alert("This is your own post!");
        return;
    }

    const encName = encodeURIComponent(ownerName);
    window.location.href = `messages.html?user_id=${ownerId}&name=${encName}`;
}

</script>

</script>

</body>
</html>
