<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LostLink</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">LostLink</div>
        <nav class="nav-links">
            <!-- Populated by session.js -->
        </nav>
    </header>

    <main class="main-content">
        <div class="premium-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="margin-bottom: 0.5rem;">Create Account</h2>
                <p class="subtitle" style="margin-bottom: 0;">Join the community to start findings</p>
            </div>

            <form id="signupForm" onsubmit="signup(event)">
                <div class="form-group">
                    <input id="name" type="text" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input id="email" type="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input id="password" type="password" placeholder="Password (min 6 chars)" required>
                </div>
                <div class="form-group">
                    <input id="phone" type="tel" placeholder="Phone Number (Optional)">
                </div>
                
                <div id="error" class="message error" style="margin-bottom: 1rem;"></div>
                
                <button type="submit" class="btn-premium">Create Account</button>
            </form>

            <div class="divider">OR</div>

            <!-- Google Signup Button -->
            <button onclick="signInWithGoogle()" class="btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; margin-bottom: 1.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" style="fill: #4285F4"></path>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" style="fill: #34A853"></path>
                    <path fill="currentColor" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z" style="fill: #FBBC05"></path>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" style="fill: #EA4335"></path>
                </svg>
                Sign up with Google
            </button>

            <p class="subtitle" style="margin-top: 1rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                Already have an account? <a href="login.html" style="color: var(--accent); font-weight: 600; text-decoration: none;">Sign in here</a>
            </p>
        </div>
    </main>

    <!-- EMAIL VERIFICATION MODAL -->
    <div id="verificationModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeVerificationModal()" style="position: absolute; right: 20px; top: 15px; cursor: pointer; opacity: 0.5; font-size: 1.5rem;">&times;</span>
            <h3 style="font-family: 'Outfit'; font-size: 1.5rem; margin-bottom: 1rem;">Verify Your Email</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">We've sent a code to your email.</p>
            
            <input type="email" id="verifyEmail" readonly style="background: rgba(0,0,0,0.2); margin-bottom: 1rem; opacity: 0.7;">
            <input type="text" id="verificationCode" placeholder="6-digit code" maxlength="6" style="text-align: center; font-size: 1.25rem; letter-spacing: 4px; border-color: var(--accent);">
            
            <button onclick="verifyEmail()" class="btn-premium">Verify Account</button>
            <button onclick="resendVerificationCode(document.getElementById('verifyEmail').value)" class="btn-premium" style="background: rgba(255,255,255,0.05); color: #fff; margin-top: 10px; border: 1px solid var(--glass-border);">Resend Code</button>
            
            <div id="verifyError" class="message error" style="margin-top: 1rem; text-align: center;"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/supabase.js"></script>
    <script src="js/session.js"></script>
    <script>
        async function signInWithGoogle() {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/dashboard.html'
                }
            });

            if (error) {
                alert(error.message || 'OAuth login failed');
            }
        }

        async function signup(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            const errorDiv = document.getElementById('error');



            if(password.length < 6) {
                errorDiv.innerText = 'Password too short (min 6)';
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: name,
                        phone: phone
                    }
                }
            });

            if (error) {
                errorDiv.innerText = error.message;
            } else if (data.user) {
                errorDiv.className = 'message success';
                errorDiv.innerText = 'Account created! Please check your email for verification.';
                // Supabase handles email verification by sending a link. 
                // We'll keep the modal if they need to enter a code (OTP), 
                // but usually Supabase uses magic links or pre-defined OTPs.
                if (data.session === null) {
                    setTimeout(() => showVerificationModal(email), 1000);
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        }

        function showVerificationModal(email) {
            document.getElementById('verifyEmail').value = email;
            document.getElementById('verificationModal').style.display = 'flex';
        }

        function closeVerificationModal() {
            document.getElementById('verificationModal').style.display = 'none';
        }

        async function resendVerificationCode(email) {
            await supabase.auth.resend({
                type: 'signup',
                email: email
            });
            alert('Verification email resent!');
        }

        async function verifyEmail() {
            const email = document.getElementById('verifyEmail').value;
            const code = document.getElementById('verificationCode').value;
            const errorDiv = document.getElementById('verifyError');

            const { data, error } = await supabase.auth.verifyOtp({
                email,
                token: code,
                type: 'signup'
            });

            if (error) {
                errorDiv.innerText = error.message;
            } else {
                errorDiv.className = 'message success';
                errorDiv.innerText = 'Verified! Redirecting to login...';
                setTimeout(() => window.location.href = 'login.html', 1500);
            }
        }

        window.onclick = e => {
            if(e.target == document.getElementById('verificationModal')) closeVerificationModal();
        }
    </script>
</body>
</html>
