<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | LostLink</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="stylesheet" href="css/dark-override.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .profile-container {
            max-width: 600px;
            margin: 120px auto 60px;
            padding: 0 20px;
        }

        .form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Outfit', sans-serif;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--accent), #ff6b6b);
            color: #1e1b4b;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 211, 105, 0.3);
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .message.success {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
            display: block;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
            display: block;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">LostLink</div>
        <nav class="nav-links">
            <!-- Populated by session.js -->
        </nav>
    </header>

    <div class="profile-container">
        <div class="form-card">
            <div class="profile-header">
                <h1>My Profile</h1>
                <p style="color: var(--text-secondary);">Manage your personal information</p>
            </div>

            <div id="message" class="message"></div>

            <form id="profileForm">
                <div class="avatar-section">
                    <div class="avatar-preview" id="avatarPreview">
                        <span id="avatarPlaceholder">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address (Read Only)</label>
                    <input type="email" id="email" disabled>
                </div>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" placeholder="Your phone number">
                </div>

                <button type="submit" class="btn-submit" id="saveBtn">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/session.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await SessionManager.initialize();
            if (!SessionManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            loadProfile();
        });

        async function loadProfile() {
            const userId = SessionManager.getUserId();
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', userId)
                .single();

            if (error) {
                console.error("Error loading profile", error);
                return;
            }

            document.getElementById('email').value = profile.email || SessionManager.getUserEmail();
            document.getElementById('fullName').value = profile.full_name || '';
            document.getElementById('phone').value = profile.phone || '';

            if (profile.avatar_url) {
                document.getElementById('avatarPreview').innerHTML = `<img src="${profile.avatar_url}" alt="Avatar">`;
            } else if (profile.full_name) {
                document.getElementById('avatarPlaceholder').textContent = profile.full_name.charAt(0).toUpperCase();
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            const messageDiv = document.getElementById('message');
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const userId = SessionManager.getUserId();

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            messageDiv.style.display = 'none';

            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ 
                        full_name: fullName,
                        phone: phone
                    })
                    .eq('id', userId);

                if (error) throw error;

                // Also update auth metadata if needed
                await supabase.auth.updateUser({
                    data: { full_name: fullName, phone: phone }
                });

                messageDiv.textContent = 'Profile updated successfully!';
                messageDiv.className = 'message success';
                
                if (fullName) {
                    const avatarContent = document.getElementById('avatarPreview').innerHTML;
                    if (!avatarContent.includes('<img')) {
                        document.getElementById('avatarPlaceholder').textContent = fullName.charAt(0).toUpperCase();
                    }
                }
            } catch (error) {
                console.error('Error updating profile:', error);
                messageDiv.textContent = 'Failed to update profile: ' + error.message;
                messageDiv.className = 'message error';
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        });
    </script>
</body>
</html>
