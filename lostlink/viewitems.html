<!DOCTYPE html>

<style>

body{
font-family:'Poppins', 'Segoe UI', sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
min-height:100vh;
}

/* DARK MODE */
.dark {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #e8e8e8;
}

.navbar{
display:flex;
justify-content:space-between;
padding:20px 60px;
background:rgba(255,255,255,0.1);
}

.navbar a{

text-decoration:none;

}

.container{
padding:60px;
display:flex;
flex-wrap:wrap;
gap:30px;
justify-content:center;
}

.card{
background:white;
color:black;
width:220px;
border-radius:10px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card h4{
padding:10px;
}

</style>
